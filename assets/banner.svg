<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
<title id="t">Bit Happens</title><desc id="d">Bit Happens: free IT troubleshooting guides, browser tools and practice labs at bithappens.dev. A terminal works a switch port ticket from open to closed.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>
<radialGradient id="glowA" cx=".85" cy="0" r=".7"><stop offset="0" stop-color="#4F46E5" stop-opacity=".55"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx="0" cy="1" r=".6"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/></pattern>
<linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#E0E7FF"/><stop offset="1" stop-color="#818CF8"/></linearGradient><clipPath id="term"><rect x="700" y="72" width="520" height="316" rx="14"/></clipPath></defs>
<style>text{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'Cascadia Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:14.5px}
@keyframes bit{0%,70%,100%{transform:translate(0,0) rotate(0)}78%{transform:translate(4px,-10px) rotate(25deg)}86%{transform:translate(0,2px) rotate(-6deg)}}
.bit{transform-box:fill-box;transform-origin:center;animation:bit 4s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .cur{animation:blink 1s steps(1) infinite}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pkt{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}} .gl{animation:glow 6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.r1{animation:rise .8s ease-out both} .r2{animation:rise .8s .25s ease-out both} .r3{animation:rise .8s .5s ease-out both} .r4{animation:rise .8s .75s ease-out both}@keyframes c0{0%,2%{transform:translateX(0)}8%,96%{transform:translateX(124px)}100%{transform:translateX(0)}}.c0{animation:c0 14s steps(13) infinite}@keyframes c1{0%,9%{transform:translateX(0)}9.5%,96%{transform:translateX(339px)}100%{transform:translateX(0)}}.c1{animation:c1 14s steps(1) infinite}@keyframes c2{0%,14%{transform:translateX(0)}23%,96%{transform:translateX(330px)}100%{transform:translateX(0)}}.c2{animation:c2 14s steps(37) infinite}@keyframes c3{0%,25%{transform:translateX(0)}25.5%,96%{transform:translateX(373px)}100%{transform:translateX(0)}}.c3{animation:c3 14s steps(1) infinite}@keyframes c4{0%,31%{transform:translateX(0)}40%,96%{transform:translateX(322px)}100%{transform:translateX(0)}}.c4{animation:c4 14s steps(36) infinite}@keyframes c5{0%,42%{transform:translateX(0)}42.5%,96%{transform:translateX(365px)}100%{transform:translateX(0)}}.c5{animation:c5 14s steps(1) infinite}@keyframes c6{0%,50%{transform:translateX(0)}50.5%,96%{transform:translateX(322px)}100%{transform:translateX(0)}}.c6{animation:c6 14s steps(1) infinite}@keyframes c7{0%,57%{transform:translateX(0)}64%,96%{transform:translateX(236px)}100%{transform:translateX(0)}}.c7{animation:c7 14s steps(26) infinite}@keyframes c8{0%,66%{transform:translateX(0)}66.5%,96%{transform:translateX(347px)}100%{transform:translateX(0)}}.c8{animation:c8 14s steps(1) infinite}.pk{offset-path:path("M106 360 L560 360");animation:pkt 3.2s linear infinite} .pk2{animation-delay:1.6s}.l0{animation:led 1.10s ease-in-out infinite}.l1{animation:led 1.47s ease-in-out infinite}.l2{animation:led 1.84s ease-in-out infinite}.l3{animation:led 2.21s ease-in-out infinite}.l4{animation:led 2.58s ease-in-out infinite}.l5{animation:led 2.95s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
