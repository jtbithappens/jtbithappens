<text class="r2" x="80" y="186" font-size="58" font-weight="800" fill="url(#txt)" letter-spacing="-1.5">When IT breaks,</text>
<text class="r2" x="80" y="244" font-size="58" font-weight="800" fill="url(#txt)" letter-spacing="-1.5">start here.</text>
