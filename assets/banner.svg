<text class="mono" x="960.0" y="94" text-anchor="middle" fill="#8B93C9" font-size="12.5">ACCESS-SW-01 — ssh</text>
<g clip-path="url(#term)"><text class="mono" x="722" y="134" fill="#C7D2FE" xml:space="preserve">$ ticket open</text><rect class="c0" x="720" y="117" width="126" height="24" fill="#0F1430"/><text class="mono" x="722" y="162" fill="#FDE68A" xml:space="preserve">#BH-2048  "Printer + Wi-Fi down on 4B"</text><rect class="c1" x="720" y="145" width="341" height="24" fill="#0F1430"/><text class="mono" x="722" y="190" fill="#C7D2FE" xml:space="preserve">$ show interfaces status err-disabled</text><rect class="c2" x="720" y="173" width="332" height="24" fill="#0F1430"/><text class="mono" x="722" y="218" fill="#FCA5A5" xml:space="preserve">Gi1/0/12  desk-4B  err-disabled  bpduguard</text><rect class="c3" x="720" y="201" width="375" height="24" fill="#0F1430"/><text class="mono" x="722" y="246" fill="#C7D2FE" xml:space="preserve">$ bithappens --playbook err-disabled</text><rect class="c4" x="720" y="229" width="324" height="24" fill="#0F1430"/><text class="mono" x="722" y="274" fill="#A5B4FC" xml:space="preserve">-&gt; remove the loop, then recover the port</text><rect class="c5" x="720" y="257" width="367" height="24" fill="#0F1430"/><text class="mono" x="722" y="302" fill="#86EFAC" xml:space="preserve">Gi1/0/12  desk-4B  connected  a-1000</text><rect class="c6" x="720" y="285" width="324" height="24" fill="#0F1430"/><text class="mono" x="722" y="330" fill="#C7D2FE" xml:space="preserve">$ ticket close --minutes 6</text><rect class="c7" x="720" y="313" width="238" height="24" fill="#0F1430"/><text class="mono" x="722" y="358" fill="#86EFAC" xml:space="preserve">Closed. Users happy. Coffee still warm.</text><rect class="c8" x="720" y="341" width="349" height="24" fill="#0F1430"/></g>
<rect class="cur" x="722" y="370" width="9" height="18" fill="#22D3EE"/></g>
